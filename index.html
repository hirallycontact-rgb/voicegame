
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eeeeee">
  <title>Voice Reverse</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      background: #e6e7e7;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 88px;
      flex: 0 0 88px;
      background: #f1f1f1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      color: #111;
    }

    .title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: .4px;
    }

    .language-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .globe { font-size: 24px; }

    select {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      background: transparent;
      color: #111;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 10px 20px 10px 4px;
      max-width: 125px;
      outline-offset: 3px;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 22px 20px 28px;
      display: flex;
      flex-direction: column;
    }

    .action {
      border: 0;
      border-radius: 0;
      width: 100%;
      min-height: 190px;
      flex: 1 1 0;
      color: rgba(255,255,255,.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      cursor: pointer;
      font: inherit;
      transition: filter .15s, opacity .15s;
      -webkit-tap-highlight-color: transparent;
      padding: 24px 12px;
    }

    .action:active:not(:disabled) {
      filter: brightness(.94);
    }

    .action:disabled {
      opacity: .58;
      cursor: not-allowed;
    }

    /* BOTÓN ROJO */
    .record {
      background: #d94d4d;
    }

    /* BOTÓN VERDE */
    .reverse {
      background: #8fce55;
    }

    .action-label {
      font-size: clamp(25px, 5.8vw, 56px);
      font-weight: 400;
      letter-spacing: -.8px;
      text-align: center;
    }

    .symbol {
      width: 88px;
      height: 88px;
      display: block;
      fill: currentColor;
      flex: 0 0 auto;
    }

    .record .symbol {
      width: 86px;
      height: 112px;
    }

    .status {
      min-height: 30px;
      text-align: center;
      color: #555;
      font-size: 14px;
      padding: 8px 8px 0;
    }

    body[dir="rtl"] .action-label {
      letter-spacing: 0;
    }

    @media (min-width: 700px) {
      main { padding-top: 28px; }
      .action { min-height: 230px; }
    }

    @media (max-height: 700px) {
      .topbar {
        height: 64px;
        flex-basis: 64px;
      }

      main {
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .action {
        min-height: 180px;
        gap: 12px;
      }

      .symbol {
        width: 62px;
        height: 62px;
      }

      .record .symbol {
        width: 62px;
        height: 78px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <span class="title">VOICE REVERSE</span>

    <label class="language-wrap" aria-label="Language">
      <span class="globe" aria-hidden="true">🌐</span>

      <select id="language" aria-label="Select language">
        <option value="es">Español</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="it">Italiano</option>
        <option value="ar">العربية</option>
        <option value="tr">Türkçe</option>
        <option value="pt">Português</option>
        <option value="de">Deutsch</option>
      </select>
    </label>
  </header>

  <main>

    <!-- BOTÓN ROJO: GRABAR -->
    <button class="action record" id="recordBtn" type="button">

      <svg class="symbol" viewBox="0 0 88 112" aria-hidden="true">
        <rect x="21" y="0" width="46" height="78" rx="23"></rect>
        <path d="M9 68h12c0 17 10 29 23 29s23-12 23-29h12c0 22-14 38-35 41v3H44v-3C23 106 9 90 9 68z"></path>
      </svg>

      <span class="action-label" id="recordLabel">
        Empezar a grabar
      </span>
    </button>

    <!-- BOTÓN VERDE: REPRODUCIR AL REVÉS -->
    <button class="action reverse" id="reverseBtn" type="button" disabled>

      <svg class="symbol" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M77 9c7-4 14 1 14 9v64c0 8-7 13-14 9L14 59c-8-4-8-14 0-18L77 9z"></path>
      </svg>

      <span class="action-label" id="reverseLabel">
        Reproducir al revés
      </span>
    </button>

    <div class="status" id="status" role="status" aria-live="polite">
      Pulsa «Empezar a grabar» y permite el acceso al micrófono.
    </div>

  </main>

  <script>

    const translations = {

      es: {
        record: "Empezar a grabar",
        stop: "Detener grabación",
        reverse: "Reproducir al revés",
        initial: "Pulsa «Empezar a grabar» y permite el acceso al micrófono.",
        saving: "Guardando grabación…",
        ready: "Grabación lista. Ya puedes escucharla al revés.",
        recording: "Grabando… vuelve a pulsar el botón rojo para detener.",
        permission: "Necesitamos permiso para usar el micrófono. Permítelo e inténtalo de nuevo.",
        reversePlaying: "Reproduciendo al revés…",
        reverseFinished: "La reproducción invertida ha terminado.",
        reverseError: "Este navegador no permite invertir esta grabación."
      },

      en: {
        record: "Start Recording",
        stop: "Stop Recording",
        reverse: "Play Reverse",
        initial: "Tap Start Recording and allow microphone access.",
        saving: "Saving recording…",
        ready: "Recording ready. You can now play it in reverse.",
        recording: "Recording… tap the red button again to stop.",
        permission: "Microphone access is needed. Please allow it and try again.",
        reversePlaying: "Playing in reverse…",
        reverseFinished: "Reverse playback finished.",
        reverseError: "Reverse playback is not supported by this browser."
      },

      fr: {
        record: "Commencer l’enregistrement",
        stop: "Arrêter l’enregistrement",
        reverse: "Lire à l’envers",
        initial: "Appuyez sur Commencer l’enregistrement et autorisez le micro.",
        saving: "Enregistrement en cours de sauvegarde…",
        ready: "Enregistrement prêt. Vous pouvez maintenant l’écouter à l’envers.",
        recording: "Enregistrement… appuyez de nouveau sur le bouton rouge pour arrêter.",
        permission: "L’accès au microphone est nécessaire. Autorisez-le puis réessayez.",
        reversePlaying: "Lecture à l’envers…",
        reverseFinished: "Lecture inversée terminée.",
        reverseError: "Ce navigateur ne permet pas cette lecture inversée."
      },

      it: {
        record: "Inizia a registrare",
        stop: "Ferma registrazione",
        reverse: "Riproduci al contrario",
        initial: "Premi Inizia a registrare e consenti l’accesso al microfono.",
        saving: "Salvataggio della registrazione…",
        ready: "Registrazione pronta. Ora puoi ascoltarla al contrario.",
        recording: "Registrazione in corso… premi di nuovo il pulsante rosso per fermare.",
        permission: "È necessario consentire l’accesso al microfono. Autorizzalo e riprova.",
        reversePlaying: "Riproduzione al contrario…",
        reverseFinished: "Riproduzione inversa terminata.",
        reverseError: "Questo browser non supporta la riproduzione inversa."
      },

      ar: {
        record: "ابدأ التسجيل",
        stop: "إيقاف التسجيل",
        reverse: "تشغيل بالعكس",
        initial: "اضغط على ابدأ التسجيل واسمح باستخدام الميكروفون.",
        saving: "جارٍ حفظ التسجيل…",
        ready: "التسجيل جاهز. يمكنك الآن تشغيله بالعكس.",
        recording: "جارٍ التسجيل… اضغط على الزر الأحمر مرة أخرى للإيقاف.",
        permission: "يلزم السماح باستخدام الميكروفون. امنح الإذن ثم حاول مرة أخرى.",
        reversePlaying: "جارٍ التشغيل بالعكس…",
        reverseFinished: "انتهى التشغيل العكسي.",
        reverseError: "هذا المتصفح لا يدعم تشغيل هذا التسجيل بالعكس."
      },

      tr: {
        record: "Kaydı Başlat",
        stop: "Kaydı Durdur",
        reverse: "Tersten Oynat",
        initial: "Kaydı başlat düğmesine dokunun ve mikrofon erişimine izin verin.",
        saving: "Kayıt kaydediliyor…",
        ready: "Kayıt hazır. Artık tersten oynatabilirsiniz.",
        recording: "Kaydediliyor… durdurmak için kırmızı düğmeye tekrar dokunun.",
        permission: "Mikrofon erişimi gerekiyor. Lütfen izin verip tekrar deneyin.",
        reversePlaying: "Tersten oynatılıyor…",
        reverseFinished: "Tersten oynatma tamamlandı.",
        reverseError: "Bu tarayıcı tersten oynatmayı desteklemiyor."
      },

      pt: {
        record: "Começar a gravar",
        stop: "Parar gravação",
        reverse: "Reproduzir ao contrário",
        initial: "Toque em Começar a gravar e permita o acesso ao microfone.",
        saving: "A guardar a gravação…",
        ready: "Gravação pronta. Já pode ouvi-la ao contrário.",
        recording: "A gravar… toque novamente no botão vermelho para parar.",
        permission: "É necessário permitir o acesso ao microfone. Autorize e tente novamente.",
        reversePlaying: "A reproduzir ao contrário…",
        reverseFinished: "Reprodução invertida terminada.",
        reverseError: "Este navegador não suporta a reprodução invertida."
      },

      de: {
        record: "Aufnahme starten",
        stop: "Aufnahme stoppen",
        reverse: "Rückwärts abspielen",
        initial: "Tippe auf Aufnahme starten und erlaube den Mikrofonzugriff.",
        saving: "Aufnahme wird gespeichert…",
        ready: "Aufnahme bereit. Du kannst sie jetzt rückwärts abspielen.",
        recording: "Aufnahme läuft… tippe erneut auf die rote Taste, um zu stoppen.",
        permission: "Mikrofonzugriff ist erforderlich. Bitte erlauben und erneut versuchen.",
        reversePlaying: "Wird rückwärts abgespielt…",
        reverseFinished: "Rückwärtswiedergabe beendet.",
        reverseError: "Dieser Browser unterstützt die Rückwärtswiedergabe nicht."
      }

    };

    const languageSelect = document.getElementById('language');
    const recordBtn = document.getElementById('recordBtn');
    const recordLabel = document.getElementById('recordLabel');
    const reverseBtn = document.getElementById('reverseBtn');
    const reverseLabel = document.getElementById('reverseLabel');
    const statusEl = document.getElementById('status');

    let recorder = null;
    let chunks = [];
    let recordingBlob = null;
    let audioContext = null;
    let statusKey = 'initial';

    function t(key) {
      return translations[languageSelect.value][key];
    }

    function setStatus(key) {
      statusKey = key;
      statusEl.textContent = t(key);
    }

    function applyLanguage() {
      const lang = languageSelect.value;
      const rtl = lang === 'ar';

      document.documentElement.lang = lang;
      document.documentElement.dir = rtl ? 'rtl' : 'ltr';
      document.body.dir = rtl ? 'rtl' : 'ltr';

      recordLabel.textContent =
        recorder && recorder.state === 'recording'
          ? t('stop')
          : t('record');

      reverseLabel.textContent = t('reverse');
      statusEl.textContent = t(statusKey);

      localStorage.setItem('voicegame-language', lang);
    }

    languageSelect.addEventListener('change', applyLanguage);

    const savedLanguage = localStorage.getItem('voicegame-language');

    if (savedLanguage && translations[savedLanguage]) {
      languageSelect.value = savedLanguage;
    }

    applyLanguage();

    // GRABAR AUDIO

    recordBtn.addEventListener('click', async () => {

      if (recorder && recorder.state === 'recording') {
        recorder.stop();
        recordLabel.textContent = t('record');
        setStatus('saving');
        return;
      }

      try {

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: true
        });

        chunks = [];

        const options = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
          ? { mimeType: 'audio/webm;codecs=opus' }
          : {};

        recorder = new MediaRecorder(stream, options);

        recorder.ondataavailable = event => {
          if (event.data.size) chunks.push(event.data);
        };

        recorder.onstop = () => {

          recordingBlob = new Blob(chunks, {
            type: recorder.mimeType || 'audio/webm'
          });

          stream.getTracks().forEach(track => track.stop());

          reverseBtn.disabled = false;

          setStatus('ready');
        };

        recorder.start();

        recordLabel.textContent = t('stop');
        reverseBtn.disabled = true;

        setStatus('recording');

      } catch (error) {
        setStatus('permission');
      }

    });

    // REPRODUCIR AUDIO AL REVÉS

    reverseBtn.addEventListener('click', async () => {

      if (!recordingBlob) return;

      try {

        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) {
          throw new Error('Audio is not supported');
        }

        if (!audioContext) {
          audioContext = new AudioContextClass();
        }

        await audioContext.resume();

        const bytes = await recordingBlob.arrayBuffer();

        const decoded = await audioContext.decodeAudioData(bytes);

        const reversed = audioContext.createBuffer(
          decoded.numberOfChannels,
          decoded.length,
          decoded.sampleRate
        );

        for (
          let channel = 0;
          channel < decoded.numberOfChannels;
          channel++
        ) {

          const source = decoded.getChannelData(channel);
          const target = reversed.getChannelData(channel);

          for (
            let i = 0, j = source.length - 1;
            i < source.length;
            i++, j--
          ) {
            target[i] = source[j];
          }

        }

        const sourceNode = audioContext.createBufferSource();

        sourceNode.buffer = reversed;
        sourceNode.connect(audioContext.destination);

        sourceNode.onended = () => {
          setStatus('reverseFinished');
        };

        sourceNode.start();

        setStatus('reversePlaying');

      } catch (error) {
        setStatus('reverseError');
      }

    });

  </script>

</body>
</html>
